<style>
:root{
  --bg:#fff; --ink:#000; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --f:"Archivo Black",Archivo,"Helvetica Neue",Arial,sans-serif;
  --b:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:400;font-synthesis:none;font-size:max(10px,.625vw);line-height:1.2;}
a{color:inherit;text-decoration:none;}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px;}
button{font:inherit;color:inherit;background:none;border:0;padding:6px 8px;cursor:pointer;text-transform:uppercase;}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + .9vw) 1.1vw 0;color:#fff;mix-blend-mode:difference;text-transform:uppercase;font-size:max(10px,.625vw);}
header a{padding:6px 0;}
header .nm{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
body.home header .nm{display:none;}
body.home header{mix-blend-mode:normal;color:#fff;}
/* landing */
.hero{position:relative;height:100svh;display:grid;place-items:center;color:#fff;overflow:hidden;}
.hero h1{position:relative;z-index:2;pointer-events:none;margin:0;font-size:clamp(15px,2vw,34px);font-weight:400;letter-spacing:.01em;text-transform:uppercase;}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;display:block;}
.sl.on{opacity:1;}
.sl .ph,.sl img{width:100%;height:100%;object-fit:cover;display:block;}
@media (prefers-reduced-motion:reduce){.sl{transition:none;}}
/* placeholders */
.ph{background:hsl(var(--h) 12% var(--l));position:relative;}
.ph[data-n]::after{content:attr(data-n);position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:500;color:rgba(255,255,255,.85);}
/* projects page */
.pj{position:relative;height:100svh;}
.plist{position:absolute;left:1.1vw;top:calc(env(safe-area-inset-top,0px) + 3.2vw);display:flex;flex-direction:column;font-size:max(13px,1.04vw);}
.plist a{padding:0;line-height:1.1;}
.plist a:hover,.plist a:focus-visible{text-decoration:underline;text-underline-offset:3px;}
.prev{position:absolute;left:29.1%;top:5.7%;height:91%;aspect-ratio:1310/983;max-width:68.2%;overflow:hidden;}
.prev>*{width:100%;height:100%;object-fit:cover;display:block;}
.prev>model-viewer{object-fit:initial;}
.prev>video{background:#fff;}
/* project canvas (Figma frame, 1920 wide) */
.cv{position:relative;width:100%;overflow:hidden;background:#fff;container-type:inline-size;}
.cv .it{position:absolute;}
.cv .it>img{width:100%;height:100%;object-fit:cover;display:block;}
.cv .it>.ph{width:100%;height:100%;}
.tx{position:absolute;margin:0;font-family:var(--b);font-weight:100;font-size:max(9px,.625cqw);line-height:1.18;color:#000;}
.tx .t{font-style:italic;font-weight:300;}
.tx i{font-style:italic;}
.slot{position:absolute;inset:0;display:grid;place-items:center;font-weight:400;color:#bbb;}
/* video carousel */
.vc{overflow:hidden;}
.vs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
.vs::-webkit-scrollbar{display:none;}
.vs>div{flex:0 0 100%;scroll-snap-align:start;position:relative;height:100%;}
.vs video{width:100%;height:100%;object-fit:contain;display:block;background:transparent;}
.vc.cover .vs video{object-fit:cover;}
.vc.strip .vs{align-items:center;gap:1.4cqw;padding:0 1.4cqw;scroll-snap-type:x proximity;}
.vc.strip .vs>div{flex:0 0 44%;height:auto;aspect-ratio:16/9;scroll-snap-align:center;}
.vc.strip .vs video{object-fit:cover;}
.vc.strip .vn{bottom:.2cqw;}
.vc.proc .vs{gap:1.2cqw;scroll-snap-type:x proximity;}
.vc.proc .vs>div{flex:0 0 auto;width:auto;scroll-snap-align:start;}
.vc.proc img,.vc.proc video{height:100%;width:auto;display:block;max-width:none;}
.vc.proc .vn{bottom:.5cqw;}
.mf .vc.proc{height:62vw;aspect-ratio:auto;margin-bottom:34px;}
.vn{position:absolute;left:0;right:0;bottom:.4cqw;display:flex;justify-content:center;align-items:center;gap:1.2cqw;color:#fff;mix-blend-mode:difference;text-transform:uppercase;font-size:max(10px,.625cqw);z-index:2;pointer-events:none;}
.vn button{pointer-events:auto;padding:4px 8px;}
.vm model-viewer{display:block;width:100%;height:100%;background:transparent;--poster-color:transparent;}
/* book */
.bk{position:relative;aspect-ratio:16/9;background:#fff;overflow:hidden;display:grid;place-items:center;align-items:start;}
.spread{display:flex;align-items:center;justify-content:center;width:100%;height:82%;margin-top:1.5%;cursor:pointer;}
.spread img{max-width:92%;max-height:100%;width:auto;height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.18));}
.spread .ph{width:70%;height:80%;}
.bkit .bk{aspect-ratio:auto;width:100%;height:100%;}
.bkit .spread{height:88%;margin-top:0;}
.bkit .spread img{filter:none;}
.bkit .spread img{max-width:100%;max-height:100%;}
.mf .bkit .bk{aspect-ratio:4/3;height:auto;margin-bottom:14px;}
.bkc{position:absolute;bottom:.8vw;left:0;right:0;display:flex;justify-content:center;gap:1.5vw;align-items:center;}
.end{display:flex;justify-content:space-between;gap:16px;padding:3vw 1.1vw 2vw;text-transform:uppercase;}
.end a:hover{text-decoration:underline;text-underline-offset:3px;}
/* about */
.about{display:grid;grid-template-columns:29.1vw minmax(0,1fr);gap:0;padding:7vw 1.1vw 8vw;}
.about .ap img{display:block;width:100%;height:auto;}
.about .ah{text-transform:none;font-family:var(--b);font-weight:400;margin-top:2.2em;}
.about a{text-decoration:underline;text-underline-offset:3px;}
.about p{max-width:44em;margin:0 0 .8em;font-family:var(--b);font-weight:100;font-size:max(12px,.8vw);}
/* mobile flow */
.mf{padding:56px 14px 0;}
.mf .mi{position:relative;overflow:hidden;margin-bottom:14px;}
.mf .mi img{width:100%;height:100%;object-fit:cover;display:block;}
.mf .tx{position:static;font-size:12px;margin:0 0 14px;width:auto;}
.mf .vc{height:auto;aspect-ratio:16/9;margin-bottom:14px;}
.mf .vm{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;}
.mf .vm model-viewer{height:70vw;}
@media (max-width:700px){
  .plist{position:static;padding:calc(env(safe-area-inset-top,0px) + 56px) 14px 40px;font-size:18px;gap:4px;}
  .prev{display:none;}
  .pj{height:auto;}
  .about{grid-template-columns:1fr;gap:24px;padding:80px 14px 60px;}
  header{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;}
  .end{padding:24px 14px 20px;}
}

  document.getElementById("bkn").textContent=(bookKey+1)+" / "+total;
}
function turn(d){bookKey+=d;drawBook();}

var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){kick(v);}else{v.pause();}});},{threshold:.5}):null;
function hookVideos(){if(!io){return;}document.querySelectorAll("video[data-auto]").forEach(function(v){io.observe(v);});}
function vlabel(car){
  var s=car.querySelector(".vs"), l=car.querySelector("[data-vl]"); if(!s||!l){return;}
  var n=s.children.length, mx=Math.max(1,s.scrollWidth-s.clientWidth), i=Math.min(n-1,Math.round(s.scrollLeft/mx*(n-1)));
  l.textContent=(i+1)+" / "+n+" · "+s.children[i].dataset.t;
}
document.addEventListener("scroll",function(e){var t=e.target;if(t&&t.classList&&t.classList.contains("vs")){vlabel(t.parentNode);}},true);

function render(){
  clearInterval(timer); bookKey=0;
  var h=(location.hash||"").slice(1), k=-1;
  P.forEach(function(p,i){if(p.s===h){k=i;}});
  var html;
  if(k>=0){html=project(k);document.title="Lykke Gowran – "+P[k].t;}
  else if(h==="projects"){html=projects();document.title="Lykke Gowran – Projects";}
  else if(h==="about"){html=about();document.title="Lykke Gowran – About";}
  else{html=home();document.title="Lykke Gowran";}
  document.body.classList.toggle("home",!(k>=0||h==="projects"||h==="about"));
  app.innerHTML=html;
  if(h==="projects"){var j=P.map(function(p){return p.s;}).indexOf("jesseli");var box=document.querySelector(".prev");if(box&&!mq.matches){if(!previewFor(P[j],box)){box.innerHTML="";}}}
  drawBook();hookVideos();
  if(document.getElementById("show")){startShow();}
  window.scrollTo(0,0);
}
document.addEventListener("mouseover",function(e){var a=e.target.closest&&e.target.closest(".plist a");if(a){startPreview(+a.dataset.i);}});
document.addEventListener("focusin",function(e){var a=e.target.closest&&e.target.closest(".plist a");if(a){startPreview(+a.dataset.i);}});
document.addEventListener("click",function(e){
  var vb=e.target.closest&&e.target.closest("[data-vs]");
  if(vb){var car=vb.closest("[data-vc]"),s=car.querySelector(".vs");s.scrollBy({left:(+vb.dataset.vs)*(car.classList.contains('proc')?s.clientWidth*.6:(car.querySelector('.strip')||car.classList.contains('strip')?s.children[0].offsetWidth*1.04:s.clientWidth)),behavior:"smooth"});return;}
  var b=e.target.closest&&e.target.closest("[data-bk]");
  if(b){turn(+b.dataset.bk);return;}
  var s2=e.target.closest&&e.target.closest("#spread");
  if(s2){var r=s2.getBoundingClientRect();turn(e.clientX>r.left+r.width/2?1:-1);}
});
document.addEventListener("keydown",function(e){
  if(!document.getElementById("spread")){return;}
  if(e.key==="ArrowRight"){turn(1);}else if(e.key==="ArrowLeft"){turn(-1);}
});
window.addEventListener("hashchange",render);
if(mq.addEventListener){mq.addEventListener("change",render);}
render();
</script>
</body>
</html>
